# Optional Wayland clipboard integration. Requires wl-copy.

set -s set-clipboard off
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

if-shell -F '#{==:#{@tmux_enable_wayland_clipboard},1}' {
if-shell 'command -v wl-copy >/dev/null 2>&1' {
  set -s set-clipboard on
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
  bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "wl-copy"
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "wl-copy"
}
}
