# Nord colors, classic tmux-style: flat text instead of filled blocks.

set-option -g status-position bottom
set -g status-justify left
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-interval 1

# Left side: session name.
set -g status-left-length 24
set -g status-left " #[fg=#88c0d0,bold][#S] #[fg=#4c566a]| "

# Right side: prefix indicator, current folder, date, and time.
set -g status-right-length 80
set -g status-right "#[fg=#ebcb8b]#{?client_prefix,PREFIX | ,}#[fg=#81a1c1]#{b:pane_current_path} #[fg=#4c566a]| #[fg=#81a1c1]%Y-%m-%d #[fg=#88c0d0]%H:%M:%S "

# Copy mode selection.
set -g mode-style "fg=#88c0d0,bg=#4c566a"

# Command line and messages.
set -g message-style "fg=#88c0d0,bg=#3b4252"
set -g message-command-style "fg=#eceff4,bg=#3b4252"

# Window tabs.
set -g window-status-separator ""
set-window-option -g window-status-style "bg=default,fg=#919baa"
set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-current-style "bg=default,fg=#88c0d0,bold"
set-window-option -g window-status-current-format " #I:#W* "
set-window-option -g window-status-activity-style "bg=default,fg=#ebcb8b,bold"
set-window-option -g window-status-bell-style "bg=default,fg=#ebcb8b,bold"

# Pane borders.
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#81a1c1"
