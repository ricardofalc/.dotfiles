# Optional fzf helpers. Defaults are restored first so this can be toggled.

bind-key f command-prompt { find-window -Z "%%" }
unbind-key -q C-f
bind-key o select-pane -t :.+

if-shell -F '#{==:#{@tmux_enable_fzf},1}' {
if-shell 'command -v fzf >/dev/null 2>&1 && test -x ~/.local/bin/tmux-sessionizer' {
  bind-key -r f display-popup -E -w 80% -h 80% "~/.local/bin/tmux-sessionizer"
}

if-shell 'command -v fzf >/dev/null 2>&1 && test -x ~/.local/bin/tmux-sessionizer-pane' {
  bind-key -r C-f display-popup -E -w 81% -h 80% "~/.local/bin/tmux-sessionizer-pane"
}

if-shell 'command -v fzf >/dev/null 2>&1 && test -x ~/.local/bin/tmux-fzf-open-file' {
  bind-key o run-shell -b -C 'display-popup -E -w 85% -h 80% -d "#{pane_current_path}" -e TMUX_FZF_TARGET_PANE="#{pane_id}" "~/.local/bin/tmux-fzf-open-file"'
}
}
