# Shared tmux config.
#
# Machine-specific feature flags go in ~/.tmux.local.conf.
# Example:
#   set -g @tmux_enable_fzf 0
#   set -g @tmux_enable_wayland_clipboard 0

set -g @tmux_enable_mouse 1
set -g @tmux_enable_wayland_clipboard 1
set -g @tmux_enable_fzf 1

source-file -q ~/.tmux.local.conf

source-file -q ~/.tmux.d/00-options.conf
source-file -q ~/.tmux.d/10-panes.conf
source-file -q ~/.tmux.d/20-copy-mode.conf
source-file -q ~/.tmux.d/21-copy-wayland.conf
source-file -q ~/.tmux.d/30-theme-nord.conf
source-file -q ~/.tmux.d/50-sessions.conf
source-file -q ~/.tmux.d/60-fzf.conf

source-file -q ~/.tmux.after.conf
