set-option -g mouse off

# change prefix to a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# set windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


# open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# vim-like pane resizing  
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

# vim-like pane switching
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R 

# and now unbind keys
unbind Up     
unbind Down   
unbind Left   
unbind Right  

unbind C-Up   
unbind C-Down 
unbind C-Left 
unbind C-Right

# Use vim keybindings in copy mode
set-window-option -g mode-keys vi


# Status bar

# --- Nord Theme Colors ---
# Polar Night (Backgrounds): #2e3440, #3b4252
# Snow Storm (Foregrounds): #d8dee9, #e5e9f0
# Frost (Accents): #88c0d0 (Blue), #81a1c1 (Dim Blue)

# Layout
set-option -g status-position bottom
set -g status-justify left
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-interval 60

# Left Side: Session Name in Frost Blue
set -g status-left-length 20
set -g status-left "#[bg=#88c0d0,fg=#2e3440,bold] #S #[bg=default,fg=default] "

# Right Side: Date and Time
set -g status-right-length 50
set -g status-right "#[fg=#81a1c1] %Y-%m-%d #[fg=#88c0d0,bold] %H:%M "

# Style for the scroll position indicator and text selection
set -g mode-style "fg=#88c0d0,bg=#3b4252,bold"

# Command line and Messages (Prefix + :)
set -g message-style "fg=#88c0d0,bg=#3b4252,bold"

# When typing in the command line (if using vi-mode)
set -g message-command-style "fg=#88c0d0,bg=#3b4252,bold"

# Scroll mode indicator and text selection
set -g mode-style "fg=#88c0d0,bg=#3b4252,bold"

# --- Window Tabs ---

# Inactive Windows (Dim Slate)
set-window-option -g window-status-style "bg=#3b4252,fg=#919baa"
set-window-option -g window-status-format " #I:#W "

# Active Window (Snow White/Blue Accent)
set-window-option -g window-status-current-style "bg=#4c566a,fg=#eceff4,bold"
set-window-option -g window-status-current-format " #I:#W "

# Pane Borders (Optional but recommended for Nord)
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"


# Increase scrollback buffer (default is usually 2000)
set -g history-limit 50000

# Super fast escape time (Better for Vim responsiveness)
set -s escape-time 0

# Enable True Color (Standard for modern VDIs/Terminals)
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"


# Create a new session with 'Prefix + n'
# The -c "#{pane_current_path}" starts the new session in your current folder
bind-key n new-session -c "#{pane_current_path}"


# FZF Menu on git projects
bind-key -r f display-popup -E -w 80% -h 80% "~/.local/bin/tmux-sessionizer"

bind-key -r C-f display-popup -E -w 81% -h 80% "~/.local/bin/tmux-sessionizer-pane"
