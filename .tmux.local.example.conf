# Copy this file to ~/.tmux.local.conf on a machine where you want different
# tmux behavior. Do not commit the real ~/.tmux.local.conf.

# Disable mouse support.
# set -g @tmux_enable_mouse 0

# Disable Wayland clipboard integration if wl-copy is unavailable or unwanted.
# set -g @tmux_enable_wayland_clipboard 0

# Disable fzf project/file picker bindings.
# set -g @tmux_enable_fzf 0

